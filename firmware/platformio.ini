; Target: Waveshare ESP32-S3-Touch-LCD-4 (ESP32-S3-N16R8, 16MB Flash, 8MB OPI PSRAM)
; Arduino-ESP32 core 3.3.11 (same as Waveshare CI) via pioarduino platform

[env:waveshare_esp32s3_touch_lcd_4]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino

board_build.flash_mode = qio
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
board_build.partitions = partitions.csv
board_build.filesystem = littlefs

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DCORE_DEBUG_LEVEL=3
    -DLV_CONF_INCLUDE_SIMPLE
    -I${PROJECT_DIR}/include

monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600

lib_ldf_mode = chain
; GFX_Library_for_Arduino, SensorLib, WS_CH32_IO are vendored in lib/ (from Waveshare examples)
lib_deps =
    lvgl/lvgl @ 8.4.0
    emelianov/modbus-esp8266 @ ^4.1.0
    bblanchon/ArduinoJson @ ^7.1.0
    esp32async/ESPAsyncWebServer @ ^3.7.0
    esp32async/AsyncTCP @ ^3.3.0
