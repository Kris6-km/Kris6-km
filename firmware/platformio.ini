; PlatformIO Project Configuration
; Target: Waveshare ESP32-S3-Touch-LCD-4 (ESP32-S3-N16R8, 16MB Flash, 8MB PSRAM)
; Framework: Arduino

[env:waveshare_esp32s3_touch_lcd_4]
platform = espressif32 @ 6.9.0
board = esp32-s3-devkitc-1
framework = arduino

; 16MB flash with OPI PSRAM
board_build.flash_mode = qio
board_build.flash_size = 16MB
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB

board_build.extra_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DCORE_DEBUG_LEVEL=3

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DLV_CONF_INCLUDE_SIMPLE
    -I include
    -std=gnu++17
build_unflags = -std=gnu++11

monitor_speed = 115200
monitor_filters = esp32_exception_decoder, colorize
upload_speed = 921600

lib_ldf_mode = deep+
lib_deps =
    lvgl/lvgl @ ^8.3.11
    esp-arduino-libs/ESP32_Display_Panel @ ^0.2.1
    esp-arduino-libs/ESP32_IO_Expander @ ^0.1.0
    emelianov/modbus-esp8266 @ ^4.1.0
    bblanchon/ArduinoJson @ ^7.1.0
    me-no-dev/ESP Async WebServer @ ^1.2.4
    me-no-dev/AsyncTCP @ ^1.1.1
    lorol/LittleFS_esp32 @ ^1.0.6
